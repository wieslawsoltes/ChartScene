name: Finalize Uno bootstrap
on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-uno-bootstrap.yml]
permissions:
  contents: write
jobs:
  validate-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: python3 tools/bootstrap-fixes.py
      - run: dotnet run --project tests/ChartScene.Tests -c Release
      - name: Commit tested source fixes and remove bootstrap helpers
        run: |
          rm tools/bootstrap-fixes.py .github/workflows/finalize-uno-bootstrap.yml
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add src tools .github/workflows/finalize-uno-bootstrap.yml
          git commit -m 'fix(charting): correct horizontal ranges, preserve explicit viewports and initialize sample catalog lazily'
          git push origin HEAD:main
          git rev-parse HEAD > artifacts/validated-commit.txt
          git archive --format=zip --output=artifacts/source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-bootstrap-validation
          path: artifacts/
