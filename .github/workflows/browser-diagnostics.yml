name: Inspect browser diagnostics
on:
  pull_request:
    paths: [.github/workflows/browser-diagnostics.yml]
  workflow_dispatch:
    inputs:
      run_id:
        description: Application run to inspect
        required: true
        default: '38118397326'
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: application-validation
          run-id: ${{ inputs.run_id || '38118397326' }}
          github-token: ${{ github.token }}
          path: diagnostics
      - name: Summarize failures
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || '38118397326' }}
        run: |
          from pathlib import Path
          import json, os, re, urllib.request
          for directory in sorted(Path('diagnostics').glob('browser-tests*')):
              path = directory / 'results.json'
              if path.is_file():
                  value = json.loads(path.read_text())
                  print('SUMMARY', directory.name, value.get('total'), 'tests;', value.get('failed'), 'failed', flush=True)
                  for test in value.get('tests', []):
                      if not test.get('passed'):
                          print('FAILED', test.get('name'), str(test.get('error'))[:1800], flush=True)
                          print(str(test.get('trace', ''))[-2200:], flush=True)
              path = directory / 'console.json'
              if path.is_file():
                  entries = json.loads(path.read_text())
                  for item in entries[-100:]:
                      text = str(item.get('text', ''))
                      if any(term in text.lower() for term in ['exception', 'failed', 'framebuffer', 'chartscene_gl', 'error:']):
                          print('CONSOLE', directory.name, text[:3000], flush=True)
          for path in sorted(Path('diagnostics/package-consumer').glob('*.log')):
              errors = [line for line in path.read_text().splitlines() if re.search(r'error (?:[A-Z]+\d+|:)', line, re.I)]
              for line in dict.fromkeys(errors): print('PACKAGE', path.name, line[:2400], flush=True)
          base = 'https://api.github.com/repos/wieslawsoltes/ChartScene/actions/'
          def read(url):
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req) as response: return response.read()
          jobs = json.loads(read(base+'runs/'+os.environ['RUN_ID']+'/jobs'))['jobs']
          for job in jobs:
              if job['name'] != 'browser-and-desktop': continue
              text = read(base+'jobs/'+str(job['id'])+'/logs').decode('utf-8-sig')
              selected = []
              for line in text.splitlines():
                  if re.search(r'error (?:NU\d+|[A-Z]+\d+|:)|Package-only|Package set mismatch|Traceback|RuntimeError:', line, re.I):
                      selected.append(re.sub(r'^\S+Z ', '', line))
              for line in list(dict.fromkeys(selected))[:35]: print('BUILD', line[:2200], flush=True)
