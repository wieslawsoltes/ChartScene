name: Browser Validation
on:
  push:
    branches: [main]
    paths: [tests/browser/**, .github/workflows/browser-validation.yml]
  workflow_dispatch:
    inputs:
      application_run:
        description: Successful Application workflow run containing browser-app
        required: true
        default: '37998536363'
permissions:
  contents: read
  actions: read
jobs:
  compiled-uno-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: browser-app
          path: artifacts/site
          run-id: ${{ inputs.application_run || '37998536363' }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Test actual compiled Uno application
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory artifacts/site > /tmp/chartscene-http.log 2>&1 &
          python tests/browser/validate.py --catalog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: artifacts/browser-tests/
          if-no-files-found: error
