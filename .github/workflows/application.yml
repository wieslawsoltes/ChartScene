name: Application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-and-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Validate libraries
        run: dotnet run --project tests/ChartScene.Tests -c Release
      - name: Compile desktop
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          dotnet build src/ChartScene.App -c Release -f net10.0-desktop 2>&1 | tee artifacts/logs/desktop.log
      - name: Publish browser
        run: |
          set -euo pipefail
          dotnet publish src/ChartScene.App -c Release -f net10.0-browserwasm -o artifacts/publish -p:WasmShellWebAppBasePath=./ 2>&1 | tee artifacts/logs/browser.log
      - name: Stage current-commit site
        id: stage
        run: python3 tools/stage-site.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0 pillow
      - run: python -m playwright install --with-deps chromium
      - name: Validate compiled browser at repository base path
        run: |
          set -euo pipefail
          mkdir -p artifacts/server/ChartScene
          cp -a artifacts/site/. artifacts/server/ChartScene/
          python -m http.server 8765 --bind 127.0.0.1 --directory artifacts/server > artifacts/logs/server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          failed=0
          python tests/browser/validate.py --url http://127.0.0.1:8765/ChartScene/ --catalog || failed=1
          for suite in linked 3d colors overview stacks browser-ui; do
            python "tests/browser/validate-$suite.py" --url http://127.0.0.1:8765/ChartScene/ || failed=1
          done
          exit "$failed"
      - name: Package reusable libraries
        id: packages
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: |
          set -euo pipefail
          for project in Core Data Numerics Charting Rendering Rendering.Skia Interaction ThreeD Rendering.OpenGL Controls Samples Samples3D; do
            dotnet pack "src/ChartScene.$project" -c Release -o artifacts/packages
          done
          test "$(find artifacts/packages -name '*.nupkg' | wc -l)" -eq 12
      - name: Compile isolated package-only consumers
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: python3 tools/verify-packages.py
      - name: Summarize validation evidence
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import json, subprocess
          report = {'commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), 'browserSuites': {}}
          for directory in sorted(Path('artifacts').glob('browser-tests*')):
              path = directory / 'results.json'
              if not path.is_file(): continue
              value = json.loads(path.read_text())
              report['browserSuites'][directory.name] = {'total': value.get('total'), 'failed': value.get('failed')}
              for test in value.get('tests', []):
                  if not test.get('passed'):
                      print('BROWSER_FAILURE', directory.name, json.dumps(test), flush=True)
          report['browserTotal'] = sum(v['total'] or 0 for v in report['browserSuites'].values())
          report['browserFailed'] = sum(v['failed'] or 0 for v in report['browserSuites'].values())
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/summary.json').write_text(json.dumps(report, indent=2))
          print('VALIDATION_SUMMARY', json.dumps(report), flush=True)
      - name: Print preserved browser failure diagnostics
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          import json
          for directory in sorted(Path('artifacts').glob('browser-tests*')):
              path = directory / 'console.json'
              if not path.is_file(): continue
              for entry in json.loads(path.read_text())[-100:]:
                  if entry.get('type') in ('error', 'pageerror'):
                      print('BROWSER_CONSOLE', directory.name, json.dumps(entry)[:4000], flush=True)
      - name: Preserve exact source and graphics dependency metadata
        if: always()
        run: |
          mkdir -p artifacts/logs
          git rev-parse HEAD > artifacts/validated-commit.txt
          git archive --format=zip --output=artifacts/source.zip HEAD
          find "$HOME/.nuget/packages/uno.winui.graphics3dgl" -name '*.nuspec' -exec cat {} \; > artifacts/logs/gl-package-metadata.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-validation
          path: |
            artifacts/logs/
            artifacts/browser-tests/
            artifacts/browser-tests-linked/
            artifacts/browser-tests-3d/
            artifacts/browser-tests-colors/
            artifacts/browser-tests-overview/
            artifacts/browser-tests-stacks/
            artifacts/browser-tests-ui/
            artifacts/performance/
            artifacts/color-legends/
            artifacts/package-consumer/
            artifacts/core-tests.json
            artifacts/summary.json
            artifacts/validated-commit.txt
            artifacts/source.zip
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        with:
          name: reusable-packages
          path: artifacts/packages/
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        with:
          name: browser-app
          path: artifacts/site/
          include-hidden-files: true
          if-no-files-found: error
  gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dri
      - name: Render native OpenGL and ES fixtures
        run: dotnet run --project tests/ChartScene.GpuTests -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-validation
          path: artifacts/gpu-tests/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [browser-and-desktop, gpu]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browser-app
          path: site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public deployed commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: python
        run: |
          import datetime, json, os, pathlib, time, urllib.request
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          expected = os.environ['EXPECTED_SHA']
          failure = None
          for attempt in range(18):
              try:
                  request = urllib.request.Request(base + 'build-info.json?commit=' + expected, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      build = json.load(response)
                  if build.get('commit') != expected:
                      raise RuntimeError('Public build identity differs from merged source: ' + repr(build))
                  with urllib.request.urlopen(base + '?commit=' + expected, timeout=20) as response:
                      html = response.read().decode('utf-8')
                      status = response.status
                  if status != 200 or ('uno' not in html.lower() and '_framework' not in html):
                      raise RuntimeError('The public entry point is not the staged Uno application')
                  proof = {'url': base, 'expectedCommit': expected, 'buildInfo': build, 'httpStatus': status,
                      'checkedUtc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      'scope': 'Public HTTPS entry point and exact build identity; compiled runtime behavior is checked before deployment.'}
                  pathlib.Path('deployment-proof.json').write_text(json.dumps(proof, indent=2))
                  print(json.dumps(proof, indent=2), flush=True)
                  break
              except Exception as error:
                  failure = error
                  print('Public deployment not yet verified:', str(error), flush=True)
                  if attempt < 17: time.sleep(5)
          else:
              raise RuntimeError('The public deployment could not be verified') from failure
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-proof
          path: deployment-proof.json
          if-no-files-found: error
