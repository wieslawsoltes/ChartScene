name: Application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-and-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply pending bootstrap corrections
        run: if [ -f tools/bootstrap-fixes.py ]; then python3 tools/bootstrap-fixes.py; fi
      - name: Install WebAssembly toolchain
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Compile desktop application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          dotnet build src/ChartScene.App/ChartScene.App.csproj -c Release -f net10.0-desktop 2>&1 | tee artifacts/logs/desktop.log
      - name: Publish browser application
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/ChartScene.App/ChartScene.App.csproj -c Release -f net10.0-browserwasm -o artifacts/publish -p:WasmShellWebAppBasePath=./ 2>&1 | tee artifacts/logs/browser-publish.log
      - name: Stage browser site
        id: stage
        run: python3 tools/stage-site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-logs
          path: artifacts/logs/
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        with:
          name: browser-app
          path: artifacts/site/
          include-hidden-files: true
          if-no-files-found: error
