name: UI review repair
on:
  pull_request:
    paths: ['.github/workflows/ui-review-repair.yml']
permissions:
  contents: read
  actions: read
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Correct the reviewed duplicate-parent insertion
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/ChartScene.App/MainPage.cs')
          source = path.read_text()
          old = 'navigation.Children.Add(_forward); header.Children.Add(_forward); header.Children.Remove(_forward); header.Children.Add(navigation);'
          new = 'navigation.Children.Add(_forward); header.Children.Add(navigation);'
          if source.count(old) != 1:
              raise SystemExit('Expected exactly the reviewed header statement; refusing to change other source')
          path.write_text(source.replace(old, new))
      - name: Commit the correction without overwriting concurrent changes
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src/ChartScene.App/MainPage.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ChartScene.App/MainPage.cs
          git commit -m 'fix(ui): retain a single visual parent for the forward command'
          git push origin HEAD:refs/heads/feat/examples-ui-navigation
  inspect-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browser-app
          run-id: 38169214598
          github-token: ${{ github.token }}
          path: site/ChartScene
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0 pillow
      - run: python -m playwright install --with-deps chromium
      - name: Observe the preserved build without synthetic application input
        shell: python
        run: |
          from pathlib import Path
          from collections import Counter
          from playwright.sync_api import sync_playwright
          from PIL import Image
          from io import BytesIO
          import json, subprocess, time
          server = subprocess.Popen(['python','-m','http.server','8765','--bind','127.0.0.1','--directory','site'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          observations=[]
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch(args=['--enable-webgl','--ignore-gpu-blocklist','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
                  for attempt in range(4):
                      page=browser.new_page(viewport={'width':1440,'height':1000})
                      errors=[]
                      page.on('pageerror',lambda e:errors.append(str(e)))
                      page.goto('http://127.0.0.1:8765/ChartScene/?view=stacks&inputTrace=1',wait_until='domcontentloaded')
                      page.wait_for_function('window.chartSceneStacks?.ready===true',timeout=120000)
                      for sample in range(3):
                          if sample: page.wait_for_timeout(1000)
                          screenshot=page.screenshot()
                          with Image.open(BytesIO(screenshot)) as image:
                              common=Counter(image.convert('RGB').resize((100,70)).getdata()).most_common(4)
                          dom=page.evaluate('''() => ({ visibility:document.visibilityState, focus:document.hasFocus(), center:document.elementFromPoint(500,400)?.outerHTML.slice(0,2500), canvases:[...document.querySelectorAll('canvas')].map(c=>({id:c.id,width:c.width,height:c.height,rect:c.getBoundingClientRect().toJSON(),display:getComputedStyle(c).display,opacity:getComputedStyle(c).opacity})), overlays:[...document.querySelectorAll('[id]')].filter(e=>/splash|loading|uno-body/i.test(e.id)).map(e=>({id:e.id,display:getComputedStyle(e).display,opacity:getComputedStyle(e).opacity,rect:e.getBoundingClientRect().toJSON()})) })''')
                          result={'attempt':attempt,'sample':sample,'commonPixels':common,'dom':dom,'state':page.evaluate('window.chartSceneStacks'),'errors':errors.copy()}
                          observations.append(result)
                          print('COLD_START',json.dumps(result),flush=True)
                      page.close()
                  browser.close()
          finally:
              server.terminate();server.wait(timeout=10)
          Path('cold-start.json').write_text(json.dumps(observations,indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-start-observation
          path: cold-start.json
