name: Inspect preserved layout
on:
  pull_request:
    paths: ['.github/workflows/inspect-preserved-layout.yml']
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 44661969b76c3ac558214b0d6d83096a2a8b9c01
      - uses: actions/download-artifact@v4
        with:
          name: application-validation
          run-id: 38169214598
          github-token: ${{ github.token }}
          path: /tmp/chartscene-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Inspect saved pixels and state without rerunning or modifying the application
        shell: python
        run: |
          from pathlib import Path
          from collections import Counter
          from PIL import Image
          import json, shutil
          root = Path('/tmp/chartscene-diagnostics')
          output = Path('docs/reviews/evidence/pr5-446619')
          output.mkdir(parents=True, exist_ok=True)
          for directory in ['browser-tests-stacks', 'browser-tests-ui']:
              source = root / directory
              for path in sorted(source.glob('*.json')):
                  if path.name not in ['failure-state.json', 'final-state.json', 'results.json', 'managed-input.json', 'input-actions.json']: continue
                  data = json.loads(path.read_text())
                  if path.name == 'results.json': data = [t for t in data['tests'] if not t['passed']]
                  if path.name in ['input-actions.json', 'managed-input.json']: data = data[-12:]
                  print('OBSERVATION', directory, path.name, json.dumps(data)[:24000], flush=True)
                  shutil.copy2(path, output / (directory + '-' + path.name))
              for path in sorted(source.glob('*.png')):
                  if not any(term in path.name for term in ['failure','stacked-data','percent','examples-workbench']): continue
                  with Image.open(path) as image:
                      rgb = image.convert('RGB')
                      print('PIXELS', directory, path.name, rgb.size, Counter(rgb.resize((100,70)).getdata()).most_common(8), flush=True)
                  shutil.copy2(path, output / (directory + '-' + path.name))
          (output / 'provenance.json').write_text(json.dumps({'sourceCommit':'44661969b76c3ac558214b0d6d83096a2a8b9c01', 'applicationRun':38169214598, 'artifact':11713182412, 'scope':'Unmodified preserved screenshots and state from the failing test run.'}, indent=2))
      - name: Publish evidence on a separate review branch
        run: |
          set -euo pipefail
          git switch -c review/pr5-446619-layout-evidence
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reviews/evidence/pr5-446619
          git commit -m 'test: preserve PR 5 initial presentation and search failure evidence'
          git push origin HEAD:refs/heads/review/pr5-446619-layout-evidence
